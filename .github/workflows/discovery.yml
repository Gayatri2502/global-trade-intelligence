name: Daily trade contact discovery
on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
permissions:
  contents: read
concurrency:
  group: trade-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run bounded public business discovery
        env:
          CRAWLER_SIGNING_SECRET: ${{ secrets.CRAWLER_SIGNING_SECRET }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION }}
          META_IG_BUSINESS_ID: ${{ vars.META_IG_BUSINESS_ID }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            python crawler/schedule.py --manual
          else
            python crawler/schedule.py
          fi
